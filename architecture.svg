<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">
    Return Automation Agent — Component Overview
  </text>

  <!-- Excel Sheet -->
  <rect x="40" y="80" width="200" height="90" rx="8" fill="#eaf2ff" stroke="#3d6fb4" stroke-width="1.5"/>
  <text x="140" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Excel Task Sheet</text>
  <text x="140" y="135" text-anchor="middle" font-size="11.5" fill="#333333">Pending rows (To Do)</text>
  <text x="140" y="151" text-anchor="middle" font-size="11.5" fill="#333333">One row per line item</text>

  <!-- Agent Main Loop -->
  <rect x="370" y="80" width="240" height="110" rx="8" fill="#fdf1e0" stroke="#c98a2c" stroke-width="1.5"/>
  <text x="490" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Agent Main Loop</text>
  <text x="490" y="130" text-anchor="middle" font-size="11.5" fill="#333333">agent/main.py</text>
  <text x="490" y="148" text-anchor="middle" font-size="11.5" fill="#333333">groups rows by Order ID,</text>
  <text x="490" y="164" text-anchor="middle" font-size="11.5" fill="#333333">routes each order to its adapter</text>

  <!-- Browser Session -->
  <rect x="700" y="80" width="240" height="110" rx="8" fill="#eaf7ea" stroke="#3f9142" stroke-width="1.5"/>
  <text x="820" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Browser Session</text>
  <text x="820" y="130" text-anchor="middle" font-size="11.5" fill="#333333">agent/browser.py</text>
  <text x="820" y="148" text-anchor="middle" font-size="11.5" fill="#333333">persistent Chrome profile,</text>
  <text x="820" y="164" text-anchor="middle" font-size="11.5" fill="#333333">randomised human pacing</text>

  <!-- arrows top row -->
  <line x1="240" y1="125" x2="368" y2="125" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="304" y="115" text-anchor="middle" font-size="11" fill="#555555">read pending rows</text>

  <line x1="610" y1="125" x2="698" y2="125" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="654" y="115" text-anchor="middle" font-size="11" fill="#555555">new_page()</text>

  <!-- Platform Adapter Base -->
  <rect x="370" y="250" width="240" height="80" rx="8" fill="#fdf1e0" stroke="#c98a2c" stroke-width="1.5"/>
  <text x="490" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Platform Adapter (base)</text>
  <text x="490" y="298" text-anchor="middle" font-size="11.5" fill="#333333">agent/platforms/base.py</text>
  <text x="490" y="316" text-anchor="middle" font-size="11.5" fill="#333333">eligibility, batch/sequential, partial success</text>

  <line x1="490" y1="190" x2="490" y2="248" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="560" y="222" text-anchor="middle" font-size="11" fill="#555555">process_order()</text>

  <!-- Amazon / Flipkart adapters -->
  <rect x="270" y="380" width="220" height="80" rx="8" fill="#f0eefc" stroke="#6a53c9" stroke-width="1.5"/>
  <text x="380" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">AmazonAdapter</text>
  <text x="380" y="430" text-anchor="middle" font-size="11.5" fill="#333333">batch flow + sequential flow</text>
  <text x="380" y="446" text-anchor="middle" font-size="11.5" fill="#333333">agent/platforms/amazon.py</text>

  <rect x="510" y="380" width="220" height="80" rx="8" fill="#f0eefc" stroke="#6a53c9" stroke-width="1.5"/>
  <text x="620" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">FlipkartAdapter</text>
  <text x="620" y="430" text-anchor="middle" font-size="11.5" fill="#333333">sequential flow, OTP login,</text>
  <text x="620" y="446" text-anchor="middle" font-size="11.5" fill="#333333">page-state detection</text>

  <line x1="440" y1="330" x2="400" y2="378" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="540" y1="330" x2="590" y2="378" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Live sites -->
  <rect x="700" y="380" width="240" height="80" rx="8" fill="#fdeaea" stroke="#c04343" stroke-width="1.5"/>
  <text x="820" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Live Site</text>
  <text x="820" y="430" text-anchor="middle" font-size="11.5" fill="#333333">amazon.in / flipkart.com</text>
  <text x="820" y="446" text-anchor="middle" font-size="11.5" fill="#333333">real return flow, real confirmation</text>

  <line x1="730" y1="420" x2="700" y2="420" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- write-back arrow, curved from adapters back to Excel -->
  <path d="M 270 420 C 120 420, 60 300, 60 170" fill="none" stroke="#555555" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="30" y="300" font-size="11" fill="#555555" transform="rotate(-90 30 300)" text-anchor="middle">write outcome, per row</text>

  <!-- legend -->
  <rect x="40" y="500" width="14" height="14" fill="#eaf2ff" stroke="#3d6fb4"/>
  <text x="60" y="511" font-size="11" fill="#333333">Excel I/O</text>
  <rect x="150" y="500" width="14" height="14" fill="#fdf1e0" stroke="#c98a2c"/>
  <text x="170" y="511" font-size="11" fill="#333333">Orchestration</text>
  <rect x="290" y="500" width="14" height="14" fill="#f0eefc" stroke="#6a53c9"/>
  <text x="310" y="511" font-size="11" fill="#333333">Platform adapters</text>
  <rect x="440" y="500" width="14" height="14" fill="#eaf7ea" stroke="#3f9142"/>
  <text x="460" y="511" font-size="11" fill="#333333">Browser session</text>
  <rect x="590" y="500" width="14" height="14" fill="#fdeaea" stroke="#c04343"/>
  <text x="610" y="511" font-size="11" fill="#333333">External (Amazon/Flipkart)</text>
  <line x1="770" y1="507" x2="800" y2="507" stroke="#555555" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="808" y="511" font-size="11" fill="#333333">write-back path</text>
</svg>
